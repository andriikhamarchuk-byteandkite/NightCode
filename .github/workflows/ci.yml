name: CI

on:
  # No branch filter: branches are stacked, so PR bases are often not main.
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # postinstall runs `prisma generate`, which needs no database. The empty
      # value stops prisma.config.ts from reading a real URL from anywhere.
      - name: Install
        run: bun install --frozen-lockfile
        env:
          DATABASE_URL: ""

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
